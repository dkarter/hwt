name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        # v7.0.0 is an immutable release.
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/hwt

  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        # v7.0.0 is an immutable release.
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Check other formatting
        run: npx --yes dprint@0.55.2 check
