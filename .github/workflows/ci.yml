name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        # v7.0.0 is an immutable release.
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/hwt

  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        # v7.0.0 is an immutable release.
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Check other formatting
        run: |
          curl -fsSLo /tmp/aube.tar.gz https://github.com/jdx/aube/releases/download/v1.37.0/aube-v1.37.0-x86_64-unknown-linux-gnu.tar.gz
          echo '1775b37c4381bff2314c96635cac3eeb90b02bea0f33371e553a4431dc893546  /tmp/aube.tar.gz' | sha256sum -c -
          tar -xzf /tmp/aube.tar.gz -C /tmp
          sudo install /tmp/aube /usr/local/bin/aube
          aube dlx dprint@0.55.2 check

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        # v7.0.0 is an immutable release.
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install aube
        run: |
          curl -fsSLo /tmp/aube.tar.gz https://github.com/jdx/aube/releases/download/v1.37.0/aube-v1.37.0-x86_64-unknown-linux-gnu.tar.gz
          echo '1775b37c4381bff2314c96635cac3eeb90b02bea0f33371e553a4431dc893546  /tmp/aube.tar.gz' | sha256sum -c -
          tar -xzf /tmp/aube.tar.gz -C /tmp
          sudo install /tmp/aube /usr/local/bin/aube

      - name: Install dependencies
        run: aube --dir website install --frozen-lockfile

      - name: Build website
        run: aube --dir website run build
