name: Publish development build
run-name: Development build from ${{ github.event_name == 'push' && github.sha || inputs.ref }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or full commit SHA to build
        required: true
        default: main
        type: string

permissions: {}

jobs:
  quality:
    name: Resolve and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.build.outputs.commit }}
      stable-tag: ${{ steps.build.outputs.stable-tag }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          path: workflow-tools
          ref: ${{ github.workflow_sha }}

      - name: Checkout pushed commit
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
          ref: ${{ github.sha }}

      - name: Checkout requested revision
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
          ref: ${{ inputs.ref }}

      - name: Set up Go
        # v7.0.0 is an immutable release.
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Set up Node
        # v7.0.0 is an immutable release.
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install aube
        run: |
          curl -fsSLo /tmp/aube.tar.gz https://github.com/jdx/aube/releases/download/v1.37.0/aube-v1.37.0-x86_64-unknown-linux-gnu.tar.gz
          echo '1775b37c4381bff2314c96635cac3eeb90b02bea0f33371e553a4431dc893546  /tmp/aube.tar.gz' | sha256sum -c -
          tar -xzf /tmp/aube.tar.gz -C /tmp
          sudo install /tmp/aube /usr/local/bin/aube

      - name: Run quality checks
        working-directory: source
        run: |
          test -z "$(gofmt -l .)"
          aube dlx dprint@0.55.2 check
          go test ./...
          go vet ./...
          aube --dir website install --frozen-lockfile
          aube --dir website run build

      - name: Validate development release contract
        run: ./workflow-tools/scripts/test-development-release.sh

      - name: Validate GoReleaser configuration
        # v7.2.3 is an immutable release.
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check --config ../workflow-tools/.goreleaser.yaml
          workdir: source

      - name: Resolve development version
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_REF_NAME != "${{ github.event.repository.default_branch }}" ]]; then
            echo 'Development releases must be dispatched from the default branch.' >&2
            exit 1
          fi

          commit=$(git -C source rev-parse HEAD)
          stable_tag=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -1
          )
          if [[ -z $stable_tag ]]; then
            echo 'No published stable semantic-version release was found.' >&2
            exit 1
          fi

          tag=$(./workflow-tools/scripts/development-version.sh \
            "${stable_tag#v}" "$(date -u +%Y%m%d)" \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$commit")

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi

          git -C source tag "$tag" "$commit"
          {
            echo "commit=$commit"
            echo "stable-tag=$stable_tag"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"
          {
            echo '## Development build'
            echo
            echo "Target commit: \`$commit\`"
            echo "Version: \`$tag\`"
            echo
            echo 'After publication, install this exact build with:'
            echo
            echo '```sh'
            echo "mise use -g github:dkarter/hwt@${tag#v}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Build release artifacts
        # v7.2.3 is an immutable release.
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --skip=publish --clean --config ../workflow-tools/.goreleaser.yaml --release-notes ../workflow-tools/.github/development-release-notes.md
          workdir: source

      - name: Transfer release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: development-release-${{ steps.build.outputs.tag }}
          path: |
            source/dist/*.tar.gz
            source/dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Package and publish
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: development-release-${{ needs.quality.outputs.tag }}
          path: release-assets

      - name: Create draft prerelease
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.quality.outputs.tag }}
          TARGET_COMMIT: ${{ needs.quality.outputs.commit }}
          TESTED_STABLE_TAG: ${{ needs.quality.outputs.stable-tag }}
        run: |
          tag=$TAG
          current_stable_tag=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -1
          )
          if [[ $current_stable_tag != "$TESTED_STABLE_TAG" ]]; then
            echo "Stable release changed during the build: $TESTED_STABLE_TAG -> $current_stable_tag" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi

          gh release create "$tag" \
            --target "$TARGET_COMMIT" \
            --title "hwt $tag" \
            --notes 'Development build artifacts are being uploaded.' \
            --draft \
            --prerelease \
            --latest=false

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.quality.outputs.tag }}
        run: gh release upload "$TAG" -- release-assets/*

      - name: Publish complete prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.quality.outputs.tag }}
          TARGET_COMMIT: ${{ needs.quality.outputs.commit }}
        run: |
          tag=$TAG
          notes=$(mktemp)
          cat >"$notes" <<EOF
          Development build of commit \`$TARGET_COMMIT\`.

          Install this exact build:

          \`\`\`sh
          mise use -g github:dkarter/hwt@${tag#v}
          \`\`\`

          This prerelease was built with the normal GoReleaser packaging configuration. Report issues at https://github.com/dkarter/hwt/issues and include the tag and commit above.
          EOF
          gh release edit "$tag" --notes-file "$notes"
          gh release edit "$tag" --draft=false --prerelease --latest=false

      - name: Remove incomplete draft
        if: ${{ always() && steps.draft.outcome == 'success' && steps.publish.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.quality.outputs.tag }}
        run: gh release delete "$TAG" --cleanup-tag --yes
