name: Release

on:
  push:
    branches: [main]

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        if: ${{ steps.release.outputs.release_created }}
        # v7.0.0 is an immutable release.
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build release
        if: ${{ steps.release.outputs.release_created }}
        # v7.2.3 is an immutable release.
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        if: ${{ steps.release.outputs.release_created }}
        # v4.2.2 is an immutable release.
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Publish release
        if: ${{ steps.release.outputs.release_created }}
        run: gh release edit "${{ steps.release.outputs.tag_name }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
