[shell_alias]
hwt = "go run ./cmd/hwt"

[tools]
"github:crate-ci/committed" = "latest"
dprint = "latest"
fnox = "latest"
gitleaks = "latest"
go = "1.25.12"
goreleaser = "2"
lefthook = "latest"
pitchfork = "latest"
node = "24"
aube = "latest"
"npm:@fission-ai/openspec" = { version = "1.13.0", allow_builds = false }

[hooks]
postinstall = "lefthook install"

[tasks.fmt]
description = "Formats all supported files"
run = "go fmt ./... && dprint fmt"

[tasks.fmt-check]
description = "Checks formatting and fails on differences"
run = "test -z \"$(gofmt -l .)\" && dprint check"

[tasks.build]
description = "Builds hwt"
run = "go build -o hwt ./cmd/hwt"

[tasks.test]
description = "Runs tests"
run = "go test ./..."

[tasks.e2e]
description = "Runs hermetic end-to-end tests"
run = "go test ./e2e"

[tasks.e2e-live]
description = "Runs live Herdr plugin tests in an isolated container"
run = "./scripts/test-herdr-plugin-e2e-docker.sh"

[tasks.spec-check]
description = "Validates OpenSpec documents and test traceability"
run = "openspec validate --all --strict --no-interactive && go run ./cmd/spec-links validate"

[tasks.test-spec]
description = "Runs E2E tests linked to a scenario, capability, or spec"
run = "go run ./cmd/spec-links run"

[tasks.check]
description = "Runs all quality checks"
depends = ["fmt-check", "test", "spec-check", "website-build", "release-check"]
run = "go vet ./..."

[tasks.release-check]
description = "Validates development release versioning and configuration"
run = "./scripts/test-development-release.sh && goreleaser check"

[tasks.snapshot]
description = "Builds release artifacts without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.install]
description = "Installs hwt into ~/.local/bin"
run = "go build -o ~/.local/bin/hwt ./cmd/hwt"

[tasks.website-dev]
description = "Starts the website development server"
run = "aube --dir website run dev"

[tasks.website-build]
description = "Builds the website and documentation"
run = "aube --dir website install --frozen-lockfile && aube --dir website run build"
